<!DOCTYPE html>
<html>
    <head>
        <title>Calculator</title>
    </head>
    <body>
        <h2>Simple Calculator</h2>
        <form method="post" action="/add">
            Num1:<input type="number" name="number1"><br><br>
            Num2:<input type="number" name="number2"><br><br>
            <button value="Add" name="ADD">+</button>
            <button value="Sub" name="SUB">-</button>
            <button value="Mul" name="MUL">*</button>
            <button value="Div" name="DIV">/</button>
        </form>
        
        
    </body>
</html>
